[project]
name = "hangman"
version = "0.1.0"
description = "Terminal-based Hangman game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
hangman = "src.hangman:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
