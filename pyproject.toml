[project]
name = "hangman"
version = "0.1.0"
description = "Terminal-based Hangman game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["streamlit>=1.40"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "pytest-mock>=3.14"]

[project.scripts]
hangman = "hangman:main"

[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"
